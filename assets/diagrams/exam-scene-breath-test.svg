<svg viewBox="0 0 220 240" xmlns="http://www.w3.org/2000/svg">
  <title>Roadside breath test</title>
  <desc>A person blowing into a handheld breath-test device held by an officer, with no numbers or readings shown.</desc>
  <rect width="220" height="240" fill="#f8fafc"/>
  <line x1="10" y1="202" x2="210" y2="202" stroke="#cbd5e1" stroke-width="3"/>

  <!-- driver -->
  <circle cx="70" cy="70" r="16" fill="#2563eb"/>
  <rect x="52" y="90" width="36" height="60" rx="10" fill="#2563eb"/>
  <line x1="60" y1="150" x2="56" y2="200" stroke="#2563eb" stroke-width="9" stroke-linecap="round"/>
  <line x1="76" y1="150" x2="80" y2="200" stroke="#2563eb" stroke-width="9" stroke-linecap="round"/>

  <!-- device -->
  <rect x="92" y="98" width="26" height="14" rx="4" fill="#334155"/>

  <!-- officer -->
  <circle cx="150" cy="70" r="16" fill="#1e293b"/>
  <rect x="132" y="90" width="36" height="60" rx="10" fill="#1e293b"/>
  <line x1="140" y1="150" x2="136" y2="200" stroke="#1e293b" stroke-width="9" stroke-linecap="round"/>
  <line x1="156" y1="150" x2="160" y2="200" stroke="#1e293b" stroke-width="9" stroke-linecap="round"/>
  <line x1="132" y1="100" x2="110" y2="104" stroke="#1e293b" stroke-width="9" stroke-linecap="round"/>
</svg>
