<svg viewBox="0 0 420 260" xmlns="http://www.w3.org/2000/svg">
  <title>Overtaking maneuver sequence</title>
  <desc>Top-down diagram of the five-step overtaking sequence: signal left, move left, overtake, signal right, move back to the right.</desc>
  <rect width="420" height="260" fill="#f8fafc"/>
  <text x="210" y="24" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="700" fill="#1e293b">Overtaking sequence</text>

  <!-- Road -->
  <rect x="20" y="60" width="380" height="120" fill="#64748b"/>
  <line x1="20" y1="120" x2="400" y2="120" stroke="#f8fafc" stroke-width="3" stroke-dasharray="12 8"/>

  <!-- Path of the overtaking motorcycle -->
  <path d="M 50,155 C 90,155 100,90 140,90 L 260,90 C 300,90 310,155 350,155" fill="none" stroke="#0284c7" stroke-width="3" stroke-dasharray="2 8" stroke-linecap="round"/>

  <!-- Slower vehicle being overtaken, stationary in the lower lane -->
  <rect x="175" y="140" width="50" height="26" rx="5" fill="#334155"/>

  <!-- Numbered points along the path -->
  <g font-family="sans-serif" font-size="11" font-weight="700" fill="#1e293b">
    <circle cx="50" cy="155" r="12" fill="#0284c7"/><text x="50" y="159" text-anchor="middle" fill="#fff">1</text>
    <text x="50" y="185" text-anchor="middle">Signal left</text>

    <circle cx="140" cy="90" r="12" fill="#0284c7"/><text x="140" y="94" text-anchor="middle" fill="#fff">2</text>
    <rect x="108" y="61" width="64" height="16" fill="#f8fafc" opacity="0.9"/>
    <text x="140" y="73" text-anchor="middle">Move left</text>

    <circle cx="200" cy="90" r="12" fill="#0284c7"/><text x="200" y="94" text-anchor="middle" fill="#fff">3</text>
    <rect x="170" y="61" width="60" height="16" fill="#f8fafc" opacity="0.9"/>
    <text x="200" y="73" text-anchor="middle">Overtake</text>

    <circle cx="310" cy="90" r="12" fill="#0284c7"/><text x="310" y="94" text-anchor="middle" fill="#fff">4</text>
    <rect x="274" y="61" width="72" height="16" fill="#f8fafc" opacity="0.9"/>
    <text x="310" y="73" text-anchor="middle">Signal right</text>

    <circle cx="350" cy="155" r="12" fill="#0284c7"/><text x="350" y="159" text-anchor="middle" fill="#fff">5</text>
    <text x="350" y="185" text-anchor="middle">Move back right</text>
  </g>

  <text x="210" y="230" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#64748b">Check: is the road clear, and is there room to merge back safely?</text>
</svg>
