<svg viewBox="0 0 260 220" xmlns="http://www.w3.org/2000/svg">
  <title>Pedestrian at a marked crossing</title>
  <desc>Top-down view of a road with a zebra crossing, a pedestrian standing at the edge about to cross, and a car approaching.</desc>
  <rect width="260" height="220" fill="#f8fafc"/>

  <rect x="0" y="60" width="260" height="100" fill="#64748b"/>
  <g fill="#f8fafc">
    <rect x="90" y="60" width="16" height="100"/>
    <rect x="120" y="60" width="16" height="100"/>
    <rect x="150" y="60" width="16" height="100"/>
  </g>

  <!-- pedestrian, at the edge of the roadway, about to step onto the crossing -->
  <g transform="translate(115,45)">
    <circle cx="0" cy="0" r="8" fill="#1e293b"/>
    <rect x="-7" y="8" width="14" height="26" rx="6" fill="#1e293b"/>
  </g>

  <!-- approaching car -->
  <rect x="205" y="94" width="34" height="30" rx="6" fill="#f1f5f9" stroke="#334155" stroke-width="2"/>
</svg>
