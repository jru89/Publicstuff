<svg viewBox="0 0 240 320" xmlns="http://www.w3.org/2000/svg">
  <title>Motorcycles riding in staggered formation</title>
  <desc>Top-down view of three motorcycles riding within a single lane in a staggered formation, alternating between the right and left portions of the lane.</desc>
  <rect width="240" height="320" fill="#f8fafc"/>

  <rect x="30" y="0" width="180" height="320" fill="#64748b"/>
  <line x1="210" y1="0" x2="210" y2="320" stroke="#f8fafc" stroke-width="3" stroke-dasharray="14 10"/>
  <line x1="30" y1="0" x2="30" y2="320" stroke="#f8fafc" stroke-width="2"/>

  <g fill="#2563eb">
    <g transform="translate(165,80)">
      <circle cx="0" cy="-20" r="8" />
      <circle cx="0" cy="20" r="8" />
      <rect x="-5" y="-16" width="10" height="32" rx="4" />
    </g>
    <g transform="translate(75,170)">
      <circle cx="0" cy="-20" r="8" />
      <circle cx="0" cy="20" r="8" />
      <rect x="-5" y="-16" width="10" height="32" rx="4" />
    </g>
    <g transform="translate(165,260)">
      <circle cx="0" cy="-20" r="8" />
      <circle cx="0" cy="20" r="8" />
      <rect x="-5" y="-16" width="10" height="32" rx="4" />
    </g>
  </g>
</svg>
