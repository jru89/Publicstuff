<svg viewBox="0 0 420 240" xmlns="http://www.w3.org/2000/svg">
  <title>Tire tread depth</title>
  <desc>Cross-section diagram of a tire showing the minimum legal tread depth of 1.6 mm, compared to a new rear tire (6-8 mm) and new front tire (4-6 mm).</desc>
  <rect width="420" height="240" fill="#f8fafc"/>
  <text x="210" y="24" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="700" fill="#1e293b">Tire tread depth</text>

  <!-- Tire cross-section -->
  <rect x="60" y="60" width="300" height="60" rx="10" fill="#334155"/>
  <!-- Tread grooves -->
  <g stroke="#f8fafc" stroke-width="4">
    <line x1="90" y1="60" x2="90" y2="90"/>
    <line x1="130" y1="60" x2="130" y2="90"/>
    <line x1="170" y1="60" x2="170" y2="90"/>
    <line x1="210" y1="60" x2="210" y2="90"/>
    <line x1="250" y1="60" x2="250" y2="90"/>
    <line x1="290" y1="60" x2="290" y2="90"/>
    <line x1="330" y1="60" x2="330" y2="90"/>
  </g>

  <!-- Minimum depth line -->
  <line x1="60" y1="90" x2="360" y2="90" stroke="#ef4444" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="370" y="94" font-family="sans-serif" font-size="11" font-weight="700" fill="#ef4444">1.6 mm minimum</text>

  <!-- Reference bars -->
  <g font-family="sans-serif" font-size="12" fill="#1e293b">
    <rect x="80" y="155" width="30" height="45" fill="#0284c7"/>
    <text x="95" y="145" text-anchor="middle" font-weight="700">6-8 mm</text>
    <text x="95" y="218" text-anchor="middle" font-size="11">New rear tire</text>

    <rect x="180" y="170" width="30" height="30" fill="#0284c7"/>
    <text x="195" y="160" text-anchor="middle" font-weight="700">4-6 mm</text>
    <text x="195" y="218" text-anchor="middle" font-size="11">New front tire</text>

    <rect x="280" y="192" width="30" height="8" fill="#ef4444"/>
    <text x="295" y="182" text-anchor="middle" font-weight="700">1.6 mm</text>
    <text x="295" y="218" text-anchor="middle" font-size="11">Legal minimum</text>
  </g>
  <line x1="65" y1="200" x2="360" y2="200" stroke="#1e293b" stroke-width="1.5"/>
</svg>
