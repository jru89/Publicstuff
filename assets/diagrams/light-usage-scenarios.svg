<svg viewBox="0 0 460 220" xmlns="http://www.w3.org/2000/svg">
  <title>Light usage scenarios</title>
  <desc>Three scenarios for motorcycle lighting with standard dashboard-style light icons: daytime uses low beam (always mandatory), night allows high beam when no oncoming or followed traffic is close, fog or heavy rain requires the fog light.</desc>
  <rect width="460" height="220" fill="#f8fafc"/>
  <text x="230" y="24" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="700" fill="#1e293b">When to use which light</text>

  <g font-family="sans-serif">
    <!-- Day: low beam icon -->
    <rect x="30" y="50" width="120" height="120" rx="10" fill="#fde68a"/>
    <g transform="translate(70,75)" fill="none" stroke="#1e293b" stroke-width="2.5">
      <path d="M 0,10 A 10,10 0 0 1 10,0 L 20,0 L 20,20 L 10,20 A 10,10 0 0 1 0,10 Z"/>
      <line x1="22" y1="4" x2="34" y2="-2"/>
      <line x1="22" y1="10" x2="36" y2="10"/>
      <line x1="22" y1="16" x2="34" y2="22"/>
    </g>
    <text x="90" y="135" text-anchor="middle" font-size="12" font-weight="700" fill="#1e293b">Daytime</text>
    <text x="90" y="150" text-anchor="middle" font-size="10" fill="#1e293b">Low beam</text>
    <text x="90" y="163" text-anchor="middle" font-size="10" fill="#1e293b">(always on)</text>

    <!-- Night: high beam icon -->
    <rect x="170" y="50" width="120" height="120" rx="10" fill="#1e293b"/>
    <g transform="translate(210,75)" fill="none" stroke="#f8fafc" stroke-width="2.5">
      <path d="M 0,10 A 10,10 0 0 1 10,0 L 20,0 L 20,20 L 10,20 A 10,10 0 0 1 0,10 Z"/>
      <line x1="22" y1="2" x2="38" y2="2"/>
      <line x1="22" y1="10" x2="40" y2="10"/>
      <line x1="22" y1="18" x2="38" y2="18"/>
    </g>
    <text x="230" y="135" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">Night, clear</text>
    <text x="230" y="150" text-anchor="middle" font-size="10" fill="#cbd5e1">High beam if no</text>
    <text x="230" y="163" text-anchor="middle" font-size="10" fill="#cbd5e1">oncoming traffic</text>

    <!-- Fog: fog light icon -->
    <rect x="310" y="50" width="120" height="120" rx="10" fill="#94a3b8"/>
    <g transform="translate(350,75)" fill="none" stroke="#1e293b" stroke-width="2.5">
      <path d="M 0,10 A 10,10 0 0 1 10,0 L 20,0 L 20,20 L 10,20 A 10,10 0 0 1 0,10 Z"/>
      <line x1="22" y1="4" x2="38" y2="4"/>
      <path d="M 22,12 Q 27,7 32,12 T 42,12" stroke-width="2"/>
      <line x1="22" y1="18" x2="38" y2="18"/>
    </g>
    <text x="370" y="135" text-anchor="middle" font-size="12" font-weight="700" fill="#1e293b">Fog / heavy rain</text>
    <text x="370" y="150" text-anchor="middle" font-size="10" fill="#1e293b">Fog light</text>
    <text x="370" y="163" text-anchor="middle" font-size="10" fill="#1e293b">(front and/or rear)</text>
  </g>

  <text x="230" y="200" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#64748b">Rear fog light mandatory when visibility drops below 100 m</text>
</svg>
