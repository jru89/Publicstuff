<svg viewBox="0 0 420 240" xmlns="http://www.w3.org/2000/svg">
  <title>Speed zone comparison</title>
  <desc>Bar chart comparing maximum speeds in different zone types: residential home zone 20 km/h, zone 30 30 km/h, built-up area 50 km/h.</desc>
  <rect width="420" height="240" fill="#f8fafc"/>
  <text x="210" y="24" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="700" fill="#1e293b">Speed zones</text>

  <line x1="50" y1="190" x2="390" y2="190" stroke="#1e293b" stroke-width="2"/>

  <rect x="90" y="150" width="60" height="40" fill="#0284c7"/>
  <text x="120" y="145" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="700" fill="#1e293b">20</text>
  <text x="120" y="206" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#1e293b">Residential</text>
  <text x="120" y="218" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#1e293b">home zone</text>

  <rect x="190" y="120" width="60" height="70" fill="#0284c7"/>
  <text x="220" y="115" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="700" fill="#1e293b">30</text>
  <text x="220" y="210" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1e293b">Zone 30</text>

  <rect x="290" y="70" width="60" height="120" fill="#0284c7"/>
  <text x="320" y="65" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="700" fill="#1e293b">50</text>
  <text x="320" y="210" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1e293b">Built-up area</text>

  <text x="210" y="228" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#64748b">All speeds in km/h. Zone 30 applies day and night.</text>
</svg>
