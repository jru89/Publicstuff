<svg viewBox="0 0 420 260" xmlns="http://www.w3.org/2000/svg">
  <title>Overtaking scene</title>
  <desc>Top-down scene on a two-way road: a moped travels in the right-hand lane, a white car is overtaking the moped in the oncoming lane, and a blue car follows behind the white car in the right-hand lane.</desc>
  <rect width="420" height="260" fill="#f8fafc"/>

  <!-- road -->
  <rect x="0" y="40" width="420" height="180" fill="#64748b"/>
  <line x1="0" y1="130" x2="420" y2="130" stroke="#f8fafc" stroke-width="3" stroke-dasharray="14 10"/>
  <line x1="0" y1="46" x2="420" y2="46" stroke="#f8fafc" stroke-width="2"/>
  <line x1="0" y1="214" x2="420" y2="214" stroke="#f8fafc" stroke-width="2"/>

  <!-- direction of travel arrow (neutral, shows flow only) -->
  <path d="M20 172 L 45 172 M 38 165 L 46 172 L 38 179" fill="none" stroke="#cbd5e1" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- moped, right-hand lane, ahead -->
  <g transform="translate(300,150)">
    <circle cx="0" cy="10" r="8" fill="#334155"/>
    <rect x="-22" y="4" width="26" height="10" rx="4" fill="#1e293b"/>
    <circle cx="-20" cy="16" r="6" fill="#0f172a"/>
    <circle cx="4" cy="16" r="6" fill="#0f172a"/>
  </g>

  <!-- white car, oncoming lane, overtaking the moped -->
  <rect x="215" y="66" width="70" height="34" rx="7" fill="#f1f5f9" stroke="#334155" stroke-width="2"/>

  <!-- blue car, right-hand lane, behind, following -->
  <rect x="70" y="150" width="70" height="34" rx="7" fill="#2563eb"/>
</svg>
