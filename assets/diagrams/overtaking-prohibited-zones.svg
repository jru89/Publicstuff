<svg viewBox="0 0 420 280" xmlns="http://www.w3.org/2000/svg">
  <title>Where overtaking is prohibited</title>
  <desc>Three top-down diagrams showing situations where overtaking is prohibited: at the crest of a hill with poor visibility, in a blind bend, and at a pedestrian or cyclist crossing.</desc>
  <rect width="420" height="280" fill="#f8fafc"/>
  <text x="210" y="24" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="700" fill="#1e293b">Overtaking prohibited near...</text>

  <!-- 1. Hill crest -->
  <g transform="translate(20,45)">
    <rect x="0" y="60" width="110" height="70" fill="#64748b"/>
    <path d="M 0,90 Q 55,40 110,90" fill="none" stroke="#f8fafc" stroke-width="3" stroke-dasharray="8 6"/>
    <line x1="0" y1="130" x2="110" y2="130" stroke="#f8fafc" stroke-width="3"/>
    <text x="55" y="146" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="700" fill="#1e293b">Hill crest</text>
  </g>

  <!-- 2. Blind bend -->
  <g transform="translate(155,45)">
    <path d="M 0,130 C 0,80 40,60 110,60 L 110,90 C 60,90 30,105 30,130 Z" fill="#64748b"/>
    <path d="M 15,130 C 15,90 45,75 110,75" fill="none" stroke="#f8fafc" stroke-width="3" stroke-dasharray="8 6"/>
    <text x="55" y="146" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="700" fill="#1e293b">Blind bend</text>
  </g>

  <!-- 3. Pedestrian/cyclist crossing -->
  <g transform="translate(290,45)">
    <rect x="0" y="60" width="110" height="70" fill="#64748b"/>
    <g fill="#f8fafc">
      <rect x="15" y="65" width="10" height="60"/>
      <rect x="35" y="65" width="10" height="60"/>
      <rect x="55" y="65" width="10" height="60"/>
      <rect x="75" y="65" width="10" height="60"/>
      <rect x="95" y="65" width="10" height="60"/>
    </g>
    <text x="55" y="146" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="700" fill="#1e293b">Crossings</text>
  </g>

  <text x="210" y="222" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#64748b">Also prohibited: at level crossings (without barriers or moon-white light),</text>
  <text x="210" y="240" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#64748b">and at intersections governed by priority-from-the-right or where you must yield</text>
</svg>
