<svg viewBox="0 0 420 220" xmlns="http://www.w3.org/2000/svg">
  <title>Pedestrian crossing 20-meter rule</title>
  <desc>Diagram showing that if a marked pedestrian crossing exists within 20 meters, pedestrians must use it rather than crossing elsewhere.</desc>
  <rect width="420" height="220" fill="#f8fafc"/>
  <text x="210" y="24" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="700" fill="#1e293b">The 20-meter rule</text>

  <!-- Road -->
  <rect x="20" y="80" width="380" height="60" fill="#64748b"/>
  <line x1="20" y1="110" x2="400" y2="110" stroke="#f8fafc" stroke-width="2" stroke-dasharray="10 8"/>

  <!-- Crossing markings -->
  <g fill="#f8fafc">
    <rect x="80" y="85" width="8" height="50"/>
    <rect x="96" y="85" width="8" height="50"/>
    <rect x="112" y="85" width="8" height="50"/>
    <rect x="128" y="85" width="8" height="50"/>
  </g>

  <!-- Pedestrian at crossing -->
  <circle cx="105" cy="60" r="8" fill="#0284c7"/>
  <line x1="105" y1="68" x2="105" y2="80" stroke="#0284c7" stroke-width="4"/>

  <!-- Pedestrian elsewhere, within 20m, crossed out -->
  <circle cx="260" cy="60" r="8" fill="#ef4444"/>
  <line x1="260" y1="68" x2="260" y2="80" stroke="#ef4444" stroke-width="4"/>
  <line x1="248" y1="48" x2="272" y2="72" stroke="#ef4444" stroke-width="3"/>
  <line x1="272" y1="48" x2="248" y2="72" stroke="#ef4444" stroke-width="3"/>

  <!-- 20m distance bracket -->
  <line x1="132" y1="165" x2="260" y2="165" stroke="#1e293b" stroke-width="1.5"/>
  <line x1="132" y1="159" x2="132" y2="171" stroke="#1e293b" stroke-width="1.5"/>
  <line x1="260" y1="159" x2="260" y2="171" stroke="#1e293b" stroke-width="1.5"/>
  <text x="196" y="183" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="700" fill="#1e293b">Within 20 m</text>

  <text x="210" y="205" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#64748b">A pedestrian within 20 m of a marked crossing must use it</text>
</svg>
