<svg viewBox="0 0 200 260" xmlns="http://www.w3.org/2000/svg">
  <title>Officer directing traffic</title>
  <desc>An authorized person directing traffic, standing with one arm raised straight up, the other arm at their side.</desc>
  <rect width="200" height="260" fill="#f8fafc"/>

  <!-- raised arm, drawn first so it sits behind the shoulder line cleanly -->
  <line x1="112" y1="98" x2="112" y2="40" stroke="#1e293b" stroke-width="10" stroke-linecap="round"/>

  <!-- head -->
  <circle cx="100" cy="70" r="18" fill="#1e293b"/>

  <!-- torso -->
  <rect x="80" y="88" width="40" height="70" rx="10" fill="#1e293b"/>

  <!-- other arm, at side -->
  <line x1="82" y1="98" x2="70" y2="150" stroke="#1e293b" stroke-width="10" stroke-linecap="round"/>

  <!-- legs -->
  <line x1="92" y1="156" x2="86" y2="220" stroke="#1e293b" stroke-width="11" stroke-linecap="round"/>
  <line x1="108" y1="156" x2="114" y2="220" stroke="#1e293b" stroke-width="11" stroke-linecap="round"/>

  <!-- ground line -->
  <line x1="40" y1="222" x2="160" y2="222" stroke="#cbd5e1" stroke-width="3"/>
</svg>
