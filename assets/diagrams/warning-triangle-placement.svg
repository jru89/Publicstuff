<svg viewBox="0 0 420 240" xmlns="http://www.w3.org/2000/svg">
  <title>Warning triangle placement distances</title>
  <desc>Top-down diagram showing how far before a breakdown or accident to place a warning triangle: at least 30 meters on a regular road, at least 100 meters on a motorway.</desc>
  <rect width="420" height="240" fill="#f8fafc"/>
  <text x="210" y="24" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="700" fill="#1e293b">Warning triangle placement</text>

  <!-- Regular road -->
  <rect x="30" y="55" width="170" height="40" fill="#64748b"/>
  <line x1="30" y1="75" x2="200" y2="75" stroke="#f8fafc" stroke-width="2" stroke-dasharray="8 6"/>
  <!-- Triangle icon -->
  <path d="M 60,60 L 68,75 L 52,75 Z" fill="#f97316"/>
  <!-- Broken vehicle -->
  <rect x="165" y="65" width="26" height="14" rx="3" fill="#0f172a"/>
  <line x1="60" y1="98" x2="180" y2="98" stroke="#1e293b" stroke-width="1.5"/>
  <line x1="60" y1="92" x2="60" y2="104" stroke="#1e293b" stroke-width="1.5"/>
  <line x1="180" y1="92" x2="180" y2="104" stroke="#1e293b" stroke-width="1.5"/>
  <text x="120" y="116" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="700" fill="#1e293b">Min. 30 m — regular road</text>

  <!-- Motorway -->
  <rect x="30" y="150" width="360" height="40" fill="#64748b"/>
  <line x1="30" y1="170" x2="390" y2="170" stroke="#f8fafc" stroke-width="2" stroke-dasharray="8 6"/>
  <path d="M 60,155 L 68,170 L 52,170 Z" fill="#f97316"/>
  <rect x="355" y="160" width="26" height="14" rx="3" fill="#0f172a"/>
  <line x1="60" y1="193" x2="370" y2="193" stroke="#1e293b" stroke-width="1.5"/>
  <line x1="60" y1="187" x2="60" y2="199" stroke="#1e293b" stroke-width="1.5"/>
  <line x1="370" y1="187" x2="370" y2="199" stroke="#1e293b" stroke-width="1.5"/>
  <text x="215" y="211" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="700" fill="#1e293b">Min. 100 m — motorway</text>
</svg>
