<svg viewBox="0 0 480 260" xmlns="http://www.w3.org/2000/svg">
  <title>Helmet types comparison: open-face, police-style, full-face, modular</title>
  <desc>Simplified helmet silhouettes comparing four helmet types by how much of the face and chin they cover: open-face (jet), police-style, full-face (integral), and modular (flip-up).</desc>
  <rect width="480" height="260" fill="#f8fafc"/>
  <text x="240" y="24" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="700" fill="#1e293b">Helmet types</text>

  <!-- Open-face / Jet: clean dome shell ending at ear level, face fully open below -->
  <g transform="translate(35,50)">
    <path d="M 3,58 A 42,42 0 1 1 87,58 L 87,65 L 3,65 Z" fill="#0f172a"/>
    <path d="M 22,65 Q 45,86 68,65" fill="none" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round"/>
    <text x="45" y="130" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="700" fill="#1e293b">Open-face (jet)</text>
    <text x="45" y="144" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#64748b">Chin unprotected</text>
  </g>

  <!-- Police-style: same dome, plus a small front peak -->
  <g transform="translate(155,50)">
    <path d="M 0,20 L 4,4 L 26,0 L 30,15 Z" fill="#0f172a"/>
    <path d="M 3,58 A 42,42 0 1 1 87,58 L 87,65 L 3,65 Z" fill="#0f172a"/>
    <path d="M 22,65 Q 45,86 68,65" fill="none" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round"/>
    <text x="45" y="130" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="700" fill="#1e293b">Police-style</text>
    <text x="45" y="144" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#64748b">Small peak, open face</text>
  </g>

  <!-- Full-face: shell + visor cutout that stops well short of the bottom, leaving a solid chin bar -->
  <g transform="translate(275,45)">
    <rect x="0" y="0" width="90" height="95" rx="42" ry="46" fill="#0f172a"/>
    <ellipse cx="45" cy="42" rx="27" ry="22" fill="#f8fafc" stroke="#1e293b" stroke-width="2"/>
    <text x="45" y="130" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="700" fill="#1e293b">Full-face</text>
    <text x="45" y="144" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#64748b">Complete coverage</text>
  </g>

  <!-- Modular: same as full-face, plus a hinge line across the chin bar -->
  <g transform="translate(395,45)">
    <rect x="0" y="0" width="90" height="95" rx="42" ry="46" fill="#0f172a"/>
    <ellipse cx="45" cy="42" rx="27" ry="22" fill="#f8fafc" stroke="#1e293b" stroke-width="2"/>
    <line x1="20" y1="72" x2="70" y2="72" stroke="#f8fafc" stroke-width="2" stroke-dasharray="3 3"/>
    <circle cx="20" cy="72" r="3.5" fill="#f8fafc"/>
    <text x="45" y="130" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="700" fill="#1e293b">Modular</text>
    <text x="45" y="144" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#64748b">Hinged chin bar</text>
  </g>
</svg>
