<svg viewBox="0 0 480 280" xmlns="http://www.w3.org/2000/svg">
  <title>Helmet types comparison: open-face, police-style, full-face, modular</title>
  <desc>Front-view head outlines showing how much of the face each helmet type covers: open-face (jet) and police-style leave the whole face and chin exposed below the eyes; full-face and modular cover the entire head, with only a visor slot open at eye level.</desc>
  <rect width="480" height="280" fill="#f8fafc"/>
  <text x="240" y="24" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="700" fill="#1e293b">Helmet types</text>

  <defs>
    <clipPath id="head-1"><ellipse cx="45" cy="65" rx="27" ry="37"/></clipPath>
    <clipPath id="head-2"><ellipse cx="45" cy="65" rx="27" ry="37"/></clipPath>
    <clipPath id="head-3"><ellipse cx="45" cy="65" rx="27" ry="37"/></clipPath>
    <clipPath id="head-4"><ellipse cx="45" cy="65" rx="27" ry="37"/></clipPath>
  </defs>

  <!-- Open-face / Jet: shell covers only the top of the head, down to ear level -->
  <g transform="translate(30,44)">
    <ellipse cx="45" cy="65" rx="27" ry="37" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
    <rect x="8" y="18" width="74" height="34" fill="#0f172a" clip-path="url(#head-1)"/>
    <circle cx="36" cy="55" r="2.5" fill="#1e293b"/>
    <circle cx="54" cy="55" r="2.5" fill="#1e293b"/>
    <text x="45" y="152" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="700" fill="#1e293b">Open-face (jet)</text>
    <text x="45" y="166" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#64748b">Chin unprotected</text>
  </g>

  <!-- Police-style: same shell, plus a small flat peak above the forehead -->
  <g transform="translate(150,44)">
    <ellipse cx="45" cy="65" rx="27" ry="37" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
    <rect x="8" y="18" width="74" height="34" fill="#0f172a" clip-path="url(#head-2)"/>
    <rect x="24" y="13" width="42" height="8" rx="3" fill="#0f172a"/>
    <circle cx="36" cy="55" r="2.5" fill="#1e293b"/>
    <circle cx="54" cy="55" r="2.5" fill="#1e293b"/>
    <text x="45" y="152" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="700" fill="#1e293b">Police-style</text>
    <text x="45" y="166" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#64748b">Small peak, open face</text>
  </g>

  <!-- Full-face: shell covers the entire head, with only a visor slot open at eye level -->
  <g transform="translate(270,44)">
    <ellipse cx="45" cy="65" rx="27" ry="37" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
    <rect x="8" y="18" width="74" height="94" fill="#0f172a" clip-path="url(#head-3)"/>
    <rect x="20" y="46" width="50" height="20" rx="8" fill="#f8fafc"/>
    <circle cx="36" cy="55" r="2.5" fill="#1e293b"/>
    <circle cx="54" cy="55" r="2.5" fill="#1e293b"/>
    <text x="45" y="152" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="700" fill="#1e293b">Full-face</text>
    <text x="45" y="166" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#64748b">Complete coverage</text>
  </g>

  <!-- Modular: same as full-face, plus a hinge line across the chin bar -->
  <g transform="translate(390,44)">
    <ellipse cx="45" cy="65" rx="27" ry="37" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
    <rect x="8" y="18" width="74" height="94" fill="#0f172a" clip-path="url(#head-4)"/>
    <rect x="20" y="46" width="50" height="20" rx="8" fill="#f8fafc"/>
    <circle cx="36" cy="55" r="2.5" fill="#1e293b"/>
    <circle cx="54" cy="55" r="2.5" fill="#1e293b"/>
    <line x1="20" y1="88" x2="70" y2="88" stroke="#f8fafc" stroke-width="2.5" stroke-dasharray="3 3" stroke-linecap="round"/>
    <circle cx="20" cy="88" r="3" fill="#f8fafc"/>
    <text x="45" y="152" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="700" fill="#1e293b">Modular</text>
    <text x="45" y="166" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#64748b">Hinged chin bar</text>
  </g>
</svg>
