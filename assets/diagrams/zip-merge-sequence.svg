<svg viewBox="0 0 420 260" xmlns="http://www.w3.org/2000/svg">
  <title>Zip merging (ritsen)</title>
  <desc>Top-down diagram of zip merging: vehicles in the closing lane merge one at a time, alternating with vehicles in the continuing lane, right at the point where the lane ends.</desc>
  <rect width="420" height="260" fill="#f8fafc"/>
  <text x="210" y="24" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="700" fill="#1e293b">Zip merging</text>

  <!-- Two lanes, one ending -->
  <rect x="40" y="60" width="340" height="140" fill="#64748b"/>
  <line x1="40" y1="130" x2="380" y2="130" stroke="#f8fafc" stroke-width="3" stroke-dasharray="12 8"/>
  <!-- Ending lane edge, tapering in -->
  <path d="M 40,60 L 260,60 L 320,130" fill="none" stroke="#f8fafc" stroke-width="3"/>
  <line x1="40" y1="200" x2="380" y2="200" stroke="#f8fafc" stroke-width="4"/>

  <!-- Merge point marker -->
  <line x1="320" y1="60" x2="320" y2="200" stroke="#0284c7" stroke-width="2" stroke-dasharray="4 4"/>
  <text x="320" y="50" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="700" fill="#0284c7">Merge point</text>

  <!-- Vehicles alternating: 1 (top lane), 2 (bottom lane), 3 (top), 4 (bottom) -->
  <g fill="#0f172a">
    <rect x="250" y="88" width="34" height="20" rx="4"/><text x="267" y="103" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">1</text>
    <rect x="270" y="175" width="34" height="20" rx="4"/><text x="287" y="190" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">2</text>
    <rect x="150" y="88" width="34" height="20" rx="4"/><text x="167" y="103" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">3</text>
    <rect x="180" y="175" width="34" height="20" rx="4"/><text x="197" y="190" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">4</text>
  </g>

  <text x="210" y="228" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#64748b">Take turns at the merge point — this is mandatory, not a courtesy</text>
</svg>
