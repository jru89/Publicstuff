<svg viewBox="0 0 400 320" xmlns="http://www.w3.org/2000/svg">
  <title>Cornering position: right-hand bend</title>
  <desc>Top-down diagram of a right-hand bend showing the motorcycle starting close to the center line at entry (without crossing it), then sweeping wide through the bend for a better view around the curve, exiting toward the right lane.</desc>
  <rect width="400" height="320" fill="#f8fafc"/>

  <!-- Road as a curving band (outer + inner edge) -->
  <path d="M 40,300 C 40,150 120,40 340,40 L 340,100 C 160,100 100,190 100,300 Z" fill="#64748b"/>
  <!-- Outer edge line -->
  <path d="M 40,300 C 40,150 120,40 340,40" fill="none" stroke="#f8fafc" stroke-width="5"/>
  <!-- Inner edge line -->
  <path d="M 100,300 C 100,190 160,100 340,100" fill="none" stroke="#f8fafc" stroke-width="5"/>
  <!-- Center line (dashed) -->
  <path d="M 70,300 C 70,175 145,70 340,70" fill="none" stroke="#94a3b8" stroke-width="2" stroke-dasharray="9 9"/>

  <!-- Motorcycle path (accent, from near center line at entry, wide through apex, to right lane at exit) -->
  <path d="M 78,300 C 78,220 95,120 340,90" fill="none" stroke="#0284c7" stroke-width="3" stroke-dasharray="2 8" stroke-linecap="round"/>

  <!-- Motorcycle icon at entry (near center line) -->
  <g transform="translate(78,290) rotate(0)">
    <ellipse cx="0" cy="0" rx="10" ry="24" fill="#0f172a"/>
  </g>
  <!-- Motorcycle icon at apex (wide) -->
  <g transform="translate(150,140) rotate(-45)">
    <ellipse cx="0" cy="0" rx="10" ry="24" fill="#0f172a"/>
  </g>
  <!-- Motorcycle icon at exit -->
  <g transform="translate(320,85) rotate(-80)">
    <ellipse cx="0" cy="0" rx="10" ry="24" fill="#0f172a"/>
  </g>

  <text x="200" y="22" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="700" fill="#1e293b">Right-hand bend</text>
  <rect x="4" y="298" width="140" height="20" fill="#f8fafc" opacity="0.85"/>
  <text x="10" y="312" text-anchor="start" font-family="sans-serif" font-size="11" fill="#1e293b">1. Entry: close to center line</text>
  <rect x="152" y="110" width="100" height="16" fill="#f8fafc" opacity="0.85"/>
  <text x="200" y="122" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1e293b">2. Apex: wide</text>
  <rect x="255" y="60" width="120" height="16" fill="#f8fafc" opacity="0.85"/>
  <text x="315" y="72" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1e293b">3. Exit: right lane</text>
</svg>
