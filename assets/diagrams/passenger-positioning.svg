<svg viewBox="0 0 460 300" xmlns="http://www.w3.org/2000/svg">
  <title>Passenger seat requirements</title>
  <desc>Side-view diagram of a motorcycle with driver and passenger seating, showing the requirements: a pillion seat at least 50 cm long with a handgrip, and a separate pair of footpegs for the passenger positioned behind the driver's footpegs.</desc>
  <rect width="460" height="300" fill="#f8fafc"/>
  <text x="230" y="24" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="700" fill="#1e293b">Passenger seat requirements</text>

  <!-- Ground -->
  <line x1="40" y1="255" x2="420" y2="255" stroke="#1e293b" stroke-width="2"/>

  <!-- Motorcycle: wheels -->
  <circle cx="110" cy="220" r="34" fill="none" stroke="#1e293b" stroke-width="4"/>
  <circle cx="110" cy="220" r="12" fill="none" stroke="#1e293b" stroke-width="3"/>
  <circle cx="350" cy="220" r="34" fill="none" stroke="#1e293b" stroke-width="4"/>
  <circle cx="350" cy="220" r="12" fill="none" stroke="#1e293b" stroke-width="3"/>

  <!-- Swingarm + engine block -->
  <line x1="110" y1="220" x2="170" y2="185" stroke="#1e293b" stroke-width="5" stroke-linecap="round"/>
  <rect x="160" y="180" width="90" height="42" rx="6" fill="none" stroke="#1e293b" stroke-width="3"/>
  <!-- Front fork -->
  <line x1="300" y1="150" x2="350" y2="220" stroke="#1e293b" stroke-width="5" stroke-linecap="round"/>
  <!-- Tank -->
  <ellipse cx="255" cy="145" rx="38" ry="20" fill="none" stroke="#1e293b" stroke-width="3"/>
  <!-- Headlight -->
  <circle cx="310" cy="153" r="9" fill="none" stroke="#1e293b" stroke-width="3"/>
  <!-- Handlebar -->
  <line x1="298" y1="135" x2="318" y2="125" stroke="#1e293b" stroke-width="4" stroke-linecap="round"/>

  <!-- Driver seat -->
  <path d="M 170,185 C 175,168 200,158 225,158 L 235,163 L 235,175 L 175,195 Z" fill="none" stroke="#1e293b" stroke-width="3"/>

  <!-- Pillion (passenger) seat, highlighted with length measurement -->
  <rect x="150" y="163" width="70" height="16" rx="6" fill="#0284c7"/>
  <line x1="150" y1="150" x2="220" y2="150" stroke="#1e293b" stroke-width="1.5"/>
  <line x1="150" y1="144" x2="150" y2="156" stroke="#1e293b" stroke-width="1.5"/>
  <line x1="220" y1="144" x2="220" y2="156" stroke="#1e293b" stroke-width="1.5"/>
  <text x="185" y="138" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="700" fill="#1e293b">Min. 50 cm</text>

  <!-- Handgrip, behind the pillion seat -->
  <path d="M 148,168 Q 128,168 128,185" fill="none" stroke="#334155" stroke-width="5" stroke-linecap="round"/>
  <text x="95" y="192" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1e293b">Handgrip</text>

  <!-- Driver footpeg (forward, below driver seat) -->
  <line x1="215" y1="212" x2="230" y2="228" stroke="#334155" stroke-width="5" stroke-linecap="round"/>
  <rect x="222" y="235" width="40" height="14" fill="#f8fafc" opacity="0.85"/>
  <text x="242" y="246" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#1e293b">Driver peg</text>

  <!-- Passenger footpeg (further back and slightly higher, below pillion seat) -->
  <line x1="163" y1="179" x2="150" y2="205" stroke="#334155" stroke-width="5" stroke-linecap="round"/>
  <rect x="115" y="210" width="70" height="14" fill="#f8fafc" opacity="0.85"/>
  <text x="150" y="221" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#1e293b">Passenger peg</text>

  <text x="230" y="280" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#64748b">Sidesaddle ("amazon") riding is not allowed for driver or passenger</text>
</svg>
