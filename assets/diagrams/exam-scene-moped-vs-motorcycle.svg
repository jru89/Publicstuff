<svg viewBox="0 0 320 220" xmlns="http://www.w3.org/2000/svg">
  <title>A moped and a motorcycle side by side</title>
  <desc>Side view of a small moped on the left and a larger motorcycle on the right, parked side by side for size comparison, with no labels or numbers.</desc>
  <rect width="320" height="220" fill="#f8fafc"/>
  <line x1="20" y1="176" x2="300" y2="176" stroke="#cbd5e1" stroke-width="3"/>

  <!-- moped: smaller wheels, low frame, step-through style -->
  <g transform="translate(30,0)">
    <circle cx="30" cy="160" r="16" fill="#1e293b"/>
    <circle cx="110" cy="160" r="16" fill="#1e293b"/>
    <path d="M 30,160 L 50,140 L 90,140 L 110,160" fill="none" stroke="#1e293b" stroke-width="6" stroke-linecap="round"/>
    <rect x="55" y="126" width="30" height="12" rx="5" fill="#1e293b"/>
    <circle cx="70" cy="102" r="11" fill="#2563eb"/>
    <path d="M 70,113 L 66,132" stroke="#2563eb" stroke-width="8" stroke-linecap="round"/>
  </g>

  <!-- motorcycle: larger wheels, taller frame -->
  <g transform="translate(180,0)">
    <circle cx="20" cy="160" r="24" fill="#1e293b"/>
    <circle cx="130" cy="160" r="24" fill="#1e293b"/>
    <path d="M 20,160 L 55,100 L 105,96 L 130,160" fill="none" stroke="#1e293b" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="48" y="84" width="34" height="14" rx="6" fill="#1e293b"/>
    <circle cx="75" cy="58" r="13" fill="#2563eb"/>
    <path d="M 75,71 L 68,96" stroke="#2563eb" stroke-width="9" stroke-linecap="round"/>
  </g>
</svg>
