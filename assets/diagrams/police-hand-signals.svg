<svg viewBox="0 0 460 250" xmlns="http://www.w3.org/2000/svg">
  <title>Police officer hand signals</title>
  <desc>Four panels showing an authorized person's traffic control gestures: one arm bent upward at the elbow means stop (one or both arms give the same signal), arms stretched horizontally means stop for traffic facing front/back, arms waving up and down means slow down, an arm circling means speed up.</desc>
  <rect width="460" height="250" fill="#f8fafc"/>
  <text x="230" y="24" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="700" fill="#1e293b">Authorized person: hand signals</text>

  <g font-family="sans-serif" font-size="10.5" font-weight="700" fill="#1e293b">
    <!-- Panel 1: one arm bent up = stop -->
    <g transform="translate(30,50)">
      <rect x="0" y="0" width="90" height="130" rx="8" fill="#e2e8f0"/>
      <circle cx="45" cy="35" r="10" fill="#0f172a"/>
      <line x1="45" y1="45" x2="45" y2="80" stroke="#0f172a" stroke-width="6" stroke-linecap="round"/>
      <!-- raised arm: shoulder -> elbow -> hand, clear of the head -->
      <path d="M 45,50 L 22,48 L 20,15" stroke="#0f172a" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <!-- resting arm -->
      <path d="M 45,50 L 62,62 L 68,82" stroke="#0f172a" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <line x1="45" y1="80" x2="30" y2="115" stroke="#0f172a" stroke-width="6" stroke-linecap="round"/>
      <line x1="45" y1="80" x2="60" y2="115" stroke="#0f172a" stroke-width="6" stroke-linecap="round"/>
      <text x="45" y="140" text-anchor="middle">Arm bent up</text>
      <text x="45" y="153" text-anchor="middle" font-weight="400" font-size="9.5">= Stop</text>
    </g>

    <!-- Panel 2: arms horizontal = stop for cross traffic -->
    <g transform="translate(140,50)">
      <rect x="0" y="0" width="90" height="130" rx="8" fill="#e2e8f0"/>
      <circle cx="45" cy="35" r="10" fill="#0f172a"/>
      <line x1="45" y1="45" x2="45" y2="80" stroke="#0f172a" stroke-width="6" stroke-linecap="round"/>
      <line x1="10" y1="52" x2="80" y2="52" stroke="#0f172a" stroke-width="6" stroke-linecap="round"/>
      <line x1="45" y1="80" x2="30" y2="115" stroke="#0f172a" stroke-width="6" stroke-linecap="round"/>
      <line x1="45" y1="80" x2="60" y2="115" stroke="#0f172a" stroke-width="6" stroke-linecap="round"/>
      <text x="45" y="140" text-anchor="middle">Arm(s) out</text>
      <text x="45" y="153" text-anchor="middle" font-weight="400" font-size="9.5">= Stop (front/back)</text>
    </g>

    <!-- Panel 3: arms wave up/down = slow down -->
    <g transform="translate(250,50)">
      <rect x="0" y="0" width="90" height="130" rx="8" fill="#e2e8f0"/>
      <circle cx="45" cy="35" r="10" fill="#0f172a"/>
      <line x1="45" y1="45" x2="45" y2="80" stroke="#0f172a" stroke-width="6" stroke-linecap="round"/>
      <path d="M 45,50 L 18,45 L 15,70" stroke="#0f172a" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M 45,50 L 72,45 L 75,70" stroke="#0f172a" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M 8,55 Q 3,62 8,68" stroke="#0284c7" stroke-width="2" fill="none"/>
      <path d="M 82,55 Q 87,62 82,68" stroke="#0284c7" stroke-width="2" fill="none"/>
      <line x1="45" y1="80" x2="30" y2="115" stroke="#0f172a" stroke-width="6" stroke-linecap="round"/>
      <line x1="45" y1="80" x2="60" y2="115" stroke="#0f172a" stroke-width="6" stroke-linecap="round"/>
      <text x="45" y="140" text-anchor="middle">Wave up/down</text>
      <text x="45" y="153" text-anchor="middle" font-weight="400" font-size="9.5">= Slow down</text>
    </g>

    <!-- Panel 4: arm circles = speed up (remodeled) -->
    <g transform="translate(360,50)">
      <rect x="0" y="0" width="90" height="130" rx="8" fill="#e2e8f0"/>
      <circle cx="45" cy="35" r="10" fill="#0f172a"/>
      <line x1="45" y1="45" x2="45" y2="80" stroke="#0f172a" stroke-width="6" stroke-linecap="round"/>
      <!-- raised arm, hand held out to the side -->
      <path d="M 45,50 L 65,45 L 70,25" stroke="#0f172a" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <!-- circular motion trail at the hand, clearly separate from the arm -->
      <path d="M 70,25 A 14,14 0 1 1 69,25.1" stroke="#0284c7" stroke-width="3" fill="none" stroke-dasharray="3 4" marker-end="url(#rot)"/>
      <defs><marker id="rot" markerWidth="7" markerHeight="7" refX="3.5" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 z" fill="#0284c7"/></marker></defs>
      <path d="M 45,50 L 62,62 L 68,82" stroke="#0f172a" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <line x1="45" y1="80" x2="30" y2="115" stroke="#0f172a" stroke-width="6" stroke-linecap="round"/>
      <line x1="45" y1="80" x2="60" y2="115" stroke="#0f172a" stroke-width="6" stroke-linecap="round"/>
      <text x="45" y="140" text-anchor="middle">Circles arm</text>
      <text x="45" y="153" text-anchor="middle" font-weight="400" font-size="9.5">= Speed up</text>
    </g>
  </g>

  <text x="230" y="235" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#64748b">Authorized persons outrank traffic lights, signs, and priority vehicles</text>
</svg>
