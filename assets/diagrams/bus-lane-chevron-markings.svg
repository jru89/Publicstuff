<svg viewBox="0 0 420 240" xmlns="http://www.w3.org/2000/svg">
  <title>Bus lane and chevron marking</title>
  <desc>Top-down diagram of a bus lane (broken white line, no driving or parking except the last few meters before turning) and a chevron marking (wide diagonal stripes where driving, stopping, and parking are all forbidden).</desc>
  <rect width="420" height="240" fill="#f8fafc"/>
  <text x="210" y="24" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="700" fill="#1e293b">Bus lane &amp; chevron marking</text>

  <!-- Bus lane -->
  <g transform="translate(20,50)">
    <rect x="0" y="0" width="170" height="80" fill="#64748b"/>
    <rect x="0" y="0" width="170" height="26" fill="#475569"/>
    <line x1="0" y1="26" x2="170" y2="26" stroke="#f8fafc" stroke-width="3" stroke-dasharray="10 8"/>
    <rect x="10" y="6" width="30" height="14" rx="3" fill="#0284c7"/>
    <text x="25" y="16" text-anchor="middle" font-size="9" font-weight="700" fill="#fff">BUS</text>
    <text x="85" y="105" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="700" fill="#1e293b">Bus lane</text>
    <text x="85" y="120" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#64748b">No driving/parking</text>
  </g>

  <!-- Chevron marking -->
  <g transform="translate(220,50)">
    <rect x="0" y="0" width="170" height="80" fill="#64748b"/>
    <g stroke="#f8fafc" stroke-width="6">
      <line x1="10" y1="70" x2="40" y2="10"/>
      <line x1="40" y1="70" x2="70" y2="10"/>
      <line x1="70" y1="70" x2="100" y2="10"/>
      <line x1="100" y1="70" x2="130" y2="10"/>
      <line x1="130" y1="70" x2="160" y2="10"/>
    </g>
    <text x="85" y="105" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="700" fill="#1e293b">Chevron marking</text>
    <text x="85" y="120" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#64748b">No driving/stopping/parking</text>
  </g>

  <text x="210" y="200" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#64748b">Exception: bus lane may be used in the last few meters before turning</text>
</svg>
