<svg viewBox="0 0 260 300" xmlns="http://www.w3.org/2000/svg">
  <title>Motorcycle lane position</title>
  <desc>Top-down view of a single travel lane with a motorcycle positioned within it, between the left edge of the lane and the dashed centerline on the right.</desc>
  <rect width="260" height="300" fill="#f8fafc"/>

  <rect x="40" y="0" width="180" height="300" fill="#64748b"/>
  <line x1="220" y1="0" x2="220" y2="300" stroke="#f8fafc" stroke-width="3" stroke-dasharray="16 12"/>
  <line x1="40" y1="0" x2="40" y2="300" stroke="#f8fafc" stroke-width="2"/>

  <path d="M20 40 L 20 70 M 13 62 L 20 70 L 27 62" fill="none" stroke="#cbd5e1" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- motorcycle, positioned toward the right side of the lane -->
  <g transform="translate(175,150)">
    <circle cx="0" cy="-30" r="9" fill="#2563eb"/>
    <circle cx="0" cy="30" r="9" fill="#2563eb"/>
    <rect x="-6" y="-26" width="12" height="52" rx="5" fill="#2563eb"/>
  </g>
</svg>
