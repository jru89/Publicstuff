<svg viewBox="0 0 220 300" xmlns="http://www.w3.org/2000/svg">
  <title>Motorcycle beside a solid line</title>
  <desc>Top-down view of a two-lane road with a solid white line down the middle and a motorcycle in the right-hand lane approaching a slower vehicle ahead.</desc>
  <rect width="220" height="300" fill="#f8fafc"/>

  <rect x="20" y="0" width="180" height="300" fill="#64748b"/>
  <line x1="110" y1="0" x2="110" y2="300" stroke="#f8fafc" stroke-width="4"/>

  <!-- slower vehicle ahead -->
  <rect x="130" y="60" width="34" height="60" rx="7" fill="#f1f5f9" stroke="#334155" stroke-width="2"/>

  <!-- motorcycle, behind, same lane -->
  <g transform="translate(147,220)">
    <circle cx="0" cy="-24" r="9" fill="#2563eb"/>
    <circle cx="0" cy="24" r="9" fill="#2563eb"/>
    <rect x="-6" y="-20" width="12" height="40" rx="5" fill="#2563eb"/>
  </g>
</svg>
