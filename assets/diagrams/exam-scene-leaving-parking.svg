<svg viewBox="0 0 260 260" xmlns="http://www.w3.org/2000/svg">
  <title>Motorcycle leaving a parking space</title>
  <desc>Top-down view of a motorcycle pulling out of a marked parking space onto a road with passing traffic.</desc>
  <rect width="260" height="260" fill="#f8fafc"/>

  <rect x="60" y="0" width="200" height="260" fill="#64748b"/>
  <rect x="10" y="90" width="50" height="80" fill="#cbd5e1" stroke="#94a3b8" stroke-width="2"/>

  <!-- motorcycle, pulling out of the parking space at an angle -->
  <g transform="translate(90,130) rotate(-30)">
    <circle cx="-18" cy="0" r="9" fill="#2563eb"/>
    <circle cx="18" cy="0" r="9" fill="#2563eb"/>
    <rect x="-22" y="-6" width="44" height="12" rx="5" fill="#2563eb"/>
  </g>

  <!-- passing car on the road -->
  <rect x="170" y="60" width="60" height="34" rx="7" fill="#f59e0b"/>
</svg>
