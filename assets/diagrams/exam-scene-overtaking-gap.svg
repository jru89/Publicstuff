<svg viewBox="0 0 220 320" xmlns="http://www.w3.org/2000/svg">
  <title>Motorcycle overtaking a cyclist</title>
  <desc>Top-down view of a motorcycle overtaking a cyclist on a road, with a visible sideways gap between them.</desc>
  <rect width="220" height="320" fill="#f8fafc"/>

  <rect x="20" y="0" width="180" height="320" fill="#64748b"/>
  <line x1="110" y1="0" x2="110" y2="320" stroke="#f8fafc" stroke-width="3" stroke-dasharray="16 12"/>

  <!-- cyclist, ahead, in the right-hand portion of the lane -->
  <g transform="translate(140,220)">
    <circle cx="0" cy="-16" r="7" fill="#334155"/>
    <circle cx="-9" cy="16" r="9" fill="#0f172a"/>
    <circle cx="9" cy="16" r="9" fill="#0f172a"/>
    <line x1="0" y1="-10" x2="0" y2="16" stroke="#0f172a" stroke-width="4"/>
  </g>

  <!-- motorcycle, overtaking, positioned further left with a clear sideways gap -->
  <g transform="translate(70,110)">
    <circle cx="0" cy="-24" r="9" fill="#2563eb"/>
    <circle cx="0" cy="24" r="9" fill="#2563eb"/>
    <rect x="-6" y="-20" width="12" height="40" rx="5" fill="#2563eb"/>
  </g>
</svg>
