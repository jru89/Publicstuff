<svg viewBox="0 0 460 300" xmlns="http://www.w3.org/2000/svg">
  <title>Positioning before turning left</title>
  <desc>Top-down diagrams of an approach to a left turn at a cross-street. On a two-way road with lane markings, position at the far-left edge of your own lane, right against the center line, then curve left into the cross-street. On a one-way street, position at the far-left edge of the entire road, since there is no oncoming traffic to stay clear of.</desc>
  <rect width="460" height="300" fill="#f8fafc"/>
  <text x="230" y="24" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="700" fill="#1e293b">Positioning to turn left</text>

  <!-- Panel 1: two-way road -->
  <g transform="translate(20,45)">
    <text x="95" y="12" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="700" fill="#1e293b">Two-way road</text>
    <!-- main road (vertical) -->
    <rect x="45" y="20" width="100" height="200" fill="#64748b"/>
    <line x1="95" y1="20" x2="95" y2="220" stroke="#f8fafc" stroke-width="2" stroke-dasharray="8 6"/>
    <!-- cross street to the left, at the top -->
    <rect x="0" y="20" width="45" height="60" fill="#64748b"/>

    <!-- car: far-left edge of its own (right) lane, against the center line -->
    <ellipse cx="105" cy="150" rx="11" ry="24" fill="#0284c7"/>
    <!-- curved path turning left into the cross street -->
    <path d="M 105,126 C 100,90 70,70 46,55" stroke="#0284c7" stroke-width="2.5" fill="none" stroke-dasharray="2 6" marker-end="url(#tp)"/>
    <defs><marker id="tp" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#0284c7"/></marker></defs>

    <!-- bracket showing "your lane" -->
    <line x1="95" y1="240" x2="145" y2="240" stroke="#1e293b" stroke-width="1.5"/>
    <line x1="95" y1="234" x2="95" y2="246" stroke="#1e293b" stroke-width="1.5"/>
    <line x1="145" y1="234" x2="145" y2="246" stroke="#1e293b" stroke-width="1.5"/>
    <text x="120" y="257" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="700" fill="#1e293b">Your lane</text>

    <text x="95" y="278" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#64748b">Position far left, against the center line</text>
  </g>

  <!-- Panel 2: one-way street -->
  <g transform="translate(250,45)">
    <text x="95" y="12" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="700" fill="#1e293b">One-way street</text>
    <rect x="45" y="20" width="100" height="200" fill="#64748b"/>
    <!-- no center line: single direction, both lanes go the same way -->
    <line x1="95" y1="90" x2="95" y2="220" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="4 6"/>
    <rect x="0" y="20" width="45" height="60" fill="#64748b"/>

    <!-- car: far-left edge of the WHOLE road -->
    <ellipse cx="56" cy="150" rx="11" ry="24" fill="#0284c7"/>
    <path d="M 56,126 C 52,95 48,70 45,55" stroke="#0284c7" stroke-width="2.5" fill="none" stroke-dasharray="2 6" marker-end="url(#tp)"/>

    <line x1="45" y1="240" x2="145" y2="240" stroke="#1e293b" stroke-width="1.5"/>
    <line x1="45" y1="234" x2="45" y2="246" stroke="#1e293b" stroke-width="1.5"/>
    <line x1="145" y1="234" x2="145" y2="246" stroke="#1e293b" stroke-width="1.5"/>
    <text x="95" y="257" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="700" fill="#1e293b">Whole road</text>

    <text x="95" y="278" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#64748b">No oncoming traffic — go all the way left</text>
  </g>
</svg>
