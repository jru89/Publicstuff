<svg viewBox="0 0 420 220" xmlns="http://www.w3.org/2000/svg">
  <title>Safe overtaking distance</title>
  <desc>Top-down diagram showing the minimum sideways distance required when overtaking a cyclist or pedestrian: 1.5 meters outside a built-up area, 1 meter within a built-up area.</desc>
  <rect width="420" height="220" fill="#f8fafc"/>
  <text x="210" y="24" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="700" fill="#1e293b">Safe overtaking distance</text>

  <!-- Outside built-up area -->
  <g transform="translate(20,50)">
    <rect x="0" y="0" width="170" height="90" fill="#64748b"/>
    <g transform="translate(30,65)"><circle r="7" fill="#0284c7"/><circle cx="-10" r="4" fill="none" stroke="#0f172a" stroke-width="2"/><circle cx="10" r="4" fill="none" stroke="#0f172a" stroke-width="2"/></g>
    <rect x="60" y="20" width="30" height="16" rx="4" fill="#0f172a"/>
    <line x1="45" y1="60" x2="45" y2="28" stroke="#f97316" stroke-width="2"/>
    <text x="45" y="15" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="700" fill="#f97316">1.5 m</text>
    <text x="85" y="112" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1e293b">Outside built-up area</text>
  </g>

  <!-- Inside built-up area -->
  <g transform="translate(220,50)">
    <rect x="0" y="0" width="170" height="90" fill="#64748b"/>
    <g transform="translate(30,65)"><circle r="7" fill="#0284c7"/><circle cx="-10" r="4" fill="none" stroke="#0f172a" stroke-width="2"/><circle cx="10" r="4" fill="none" stroke="#0f172a" stroke-width="2"/></g>
    <rect x="55" y="20" width="30" height="16" rx="4" fill="#0f172a"/>
    <line x1="45" y1="60" x2="45" y2="28" stroke="#f97316" stroke-width="2"/>
    <text x="45" y="15" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="700" fill="#f97316">1 m</text>
    <text x="85" y="112" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1e293b">Inside built-up area</text>
  </g>

  <text x="210" y="200" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#64748b">Applies to cyclists, pedestrians, and two-wheeled moped riders</text>
</svg>
