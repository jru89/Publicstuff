<svg viewBox="0 0 460 260" xmlns="http://www.w3.org/2000/svg">
  <title>Motorcycle parking flexibility</title>
  <desc>Top-down diagram of a single row of standard perpendicular parking spaces. Most motorcycles park aligned with the marked lines like a car would, but a motorcycle does not have to follow the line orientation — it may be parked turned sideways within or across a space, as long as it fits and does not obstruct traffic, since it is much narrower than a car.</desc>
  <rect width="460" height="260" fill="#f8fafc"/>
  <text x="230" y="24" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="700" fill="#1e293b">Motorcycle parking is flexible</text>

  <!-- One consistent row of perpendicular parking spaces -->
  <rect x="40" y="60" width="380" height="110" fill="#e2e8f0"/>
  <line x1="40" y1="60" x2="40" y2="170" stroke="#94a3b8" stroke-width="2"/>
  <line x1="116" y1="60" x2="116" y2="170" stroke="#94a3b8" stroke-width="2"/>
  <line x1="192" y1="60" x2="192" y2="170" stroke="#94a3b8" stroke-width="2"/>
  <line x1="268" y1="60" x2="268" y2="170" stroke="#94a3b8" stroke-width="2"/>
  <line x1="344" y1="60" x2="344" y2="170" stroke="#94a3b8" stroke-width="2"/>
  <line x1="420" y1="60" x2="420" y2="170" stroke="#94a3b8" stroke-width="2"/>

  <!-- Space 1: motorcycle parked normally, aligned with the lines -->
  <ellipse cx="78" cy="115" rx="16" ry="34" fill="#0f172a"/>

  <!-- Space 2: another normally-parked motorcycle -->
  <ellipse cx="154" cy="115" rx="16" ry="34" fill="#0f172a"/>

  <!-- Space 3: motorcycle parked turned 90 degrees, across the space -->
  <ellipse cx="230" cy="115" rx="34" ry="16" fill="#0284c7"/>
  <line x1="230" y1="60" x2="230" y2="90" stroke="#0284c7" stroke-width="2" stroke-dasharray="3 3"/>
  <line x1="230" y1="140" x2="230" y2="170" stroke="#0284c7" stroke-width="2" stroke-dasharray="3 3"/>

  <!-- Space 4: two motorcycles sharing one space -->
  <ellipse cx="288" cy="100" rx="14" ry="28" fill="#0f172a"/>
  <ellipse cx="326" cy="100" rx="14" ry="28" fill="#0f172a"/>

  <text x="78" y="200" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="700" fill="#1e293b">Normal</text>
  <text x="230" y="200" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="700" fill="#0284c7">Turned 90&#176; — still fine</text>
  <text x="307" y="200" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="700" fill="#1e293b">Two share one space</text>

  <text x="230" y="230" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#64748b">A motorcycle doesn't have to follow the marked orientation if it still fits</text>
  <text x="230" y="246" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#64748b">Sharing a space this way still only needs one parking ticket</text>
</svg>
