<svg viewBox="0 0 300 300" xmlns="http://www.w3.org/2000/svg">
  <title>Junction scene</title>
  <desc>Top-down view of an uncontrolled crossroads with no visible signs, lights, or officer. A blue vehicle approaches from the south, moving north. An amber vehicle approaches from the east, moving west.</desc>
  <rect width="300" height="300" fill="#f8fafc"/>

  <rect x="0" y="110" width="300" height="80" fill="#64748b"/>
  <rect x="110" y="0" width="80" height="300" fill="#64748b"/>
  <line x1="0" y1="150" x2="300" y2="150" stroke="#f8fafc" stroke-width="2" stroke-dasharray="8 6"/>
  <line x1="150" y1="0" x2="150" y2="300" stroke="#f8fafc" stroke-width="2" stroke-dasharray="8 6"/>

  <!-- blue vehicle, approaching from south, moving north, own (right-hand) lane -->
  <rect x="160" y="220" width="24" height="40" rx="6" fill="#2563eb"/>

  <!-- amber vehicle, approaching from east, moving west, own (right-hand) lane -->
  <rect x="230" y="118" width="40" height="24" rx="6" fill="#f59e0b"/>
</svg>
