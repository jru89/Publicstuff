<svg viewBox="0 0 460 240" xmlns="http://www.w3.org/2000/svg">
  <title>Moped vs motorcycle comparison</title>
  <desc>Comparison chart of class A moped, class B moped, and motorcycle: maximum speed and license plate color.</desc>
  <rect width="460" height="240" fill="#f8fafc"/>
  <text x="230" y="24" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="700" fill="#1e293b">Moped vs. motorcycle</text>

  <g font-family="sans-serif">
    <!-- Class A moped -->
    <rect x="30" y="55" width="120" height="130" rx="10" fill="#1e293b"/>
    <text x="90" y="80" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">Moped class A</text>
    <text x="90" y="115" text-anchor="middle" font-size="20" font-weight="800" fill="#38bdf8">25</text>
    <text x="90" y="132" text-anchor="middle" font-size="10" fill="#94a3b8">km/h max</text>
    <rect x="65" y="150" width="50" height="20" rx="3" fill="#facc15"/>
    <text x="90" y="164" text-anchor="middle" font-size="10" font-weight="700" fill="#1e293b">Plate A</text>

    <!-- Class B moped -->
    <rect x="170" y="55" width="120" height="130" rx="10" fill="#1e293b"/>
    <text x="230" y="80" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">Moped class B</text>
    <text x="230" y="115" text-anchor="middle" font-size="20" font-weight="800" fill="#38bdf8">45</text>
    <text x="230" y="132" text-anchor="middle" font-size="10" fill="#94a3b8">km/h max</text>
    <rect x="205" y="150" width="50" height="20" rx="3" fill="#e2e8f0"/>
    <text x="230" y="164" text-anchor="middle" font-size="10" font-weight="700" fill="#1e293b">Plate B</text>

    <!-- Motorcycle -->
    <rect x="310" y="55" width="120" height="130" rx="10" fill="#1e293b"/>
    <text x="370" y="80" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">Motorcycle</text>
    <text x="370" y="115" text-anchor="middle" font-size="16" font-weight="800" fill="#38bdf8">&gt;50cc</text>
    <text x="370" y="132" text-anchor="middle" font-size="10" fill="#94a3b8">or &gt;45 km/h</text>
    <rect x="345" y="150" width="50" height="20" rx="3" fill="#e2e8f0"/>
    <text x="370" y="164" text-anchor="middle" font-size="10" font-weight="700" fill="#1e293b">Reg. plate</text>
  </g>

  <text x="230" y="210" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#64748b">Crash helmet mandatory for driver and passenger on all three</text>
</svg>
