<svg viewBox="0 0 560 320" xmlns="http://www.w3.org/2000/svg">
  <title>Emergency braking position</title>
  <desc>Side-view line diagram of a motorcycle and rider during emergency braking, with visible joints at the shoulder, elbow, hip, and knee: knees against the tank, eyes on the horizon, and the roughly two-thirds front / one-third rear brake force split.</desc>
  <rect width="560" height="320" fill="#f8fafc"/>
  <text x="230" y="26" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="700" fill="#1e293b">Emergency braking position</text>

  <!-- Ground -->
  <line x1="30" y1="270" x2="430" y2="270" stroke="#1e293b" stroke-width="2"/>

  <!-- Motorcycle: wheels -->
  <circle cx="100" cy="235" r="34" fill="none" stroke="#1e293b" stroke-width="4"/>
  <circle cx="100" cy="235" r="12" fill="none" stroke="#1e293b" stroke-width="3"/>
  <circle cx="330" cy="235" r="34" fill="none" stroke="#1e293b" stroke-width="4"/>
  <circle cx="330" cy="235" r="12" fill="none" stroke="#1e293b" stroke-width="3"/>

  <!-- Swingarm + engine block -->
  <line x1="100" y1="235" x2="160" y2="200" stroke="#1e293b" stroke-width="5" stroke-linecap="round"/>
  <rect x="150" y="195" width="80" height="42" rx="6" fill="none" stroke="#1e293b" stroke-width="3"/>
  <!-- Front fork -->
  <line x1="290" y1="165" x2="330" y2="235" stroke="#1e293b" stroke-width="5" stroke-linecap="round"/>
  <!-- Seat -->
  <path d="M 155,195 C 160,178 200,168 235,168 L 255,172 L 255,182 L 160,200 Z" fill="none" stroke="#1e293b" stroke-width="3"/>
  <!-- Tank -->
  <ellipse cx="245" cy="160" rx="38" ry="20" fill="none" stroke="#1e293b" stroke-width="3"/>
  <!-- Headlight -->
  <circle cx="300" cy="168" r="9" fill="none" stroke="#1e293b" stroke-width="3"/>
  <!-- Handlebar -->
  <line x1="288" y1="150" x2="308" y2="140" stroke="#1e293b" stroke-width="4" stroke-linecap="round"/>
  <!-- Rear brake pedal -->
  <line x1="165" y1="222" x2="150" y2="232" stroke="#1e293b" stroke-width="4" stroke-linecap="round"/>
  <!-- Footpeg -->
  <line x1="185" y1="215" x2="185" y2="228" stroke="#1e293b" stroke-width="4" stroke-linecap="round"/>

  <!-- Rider: leaning back / sitting up during braking, with visible joints -->
  <circle cx="262" cy="95" r="19" fill="none" stroke="#1e293b" stroke-width="4"/> <!-- helmet -->
  <path d="M 255,113 C 245,135 225,150 218,168" fill="none" stroke="#1e293b" stroke-width="7" stroke-linecap="round"/> <!-- torso -->
  <!-- arm: shoulder -> elbow -> hand on the handlebar -->
  <path d="M 258,118 L 280,126 L 295,145" fill="none" stroke="#1e293b" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="280" cy="126" r="4" fill="#1e293b"/> <!-- elbow joint -->
  <!-- leg: hip -> knee -> footpeg -->
  <path d="M 218,168 L 195,212 L 185,222" fill="none" stroke="#1e293b" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="195" cy="212" r="4" fill="#1e293b"/> <!-- knee joint -->
  <circle cx="218" cy="168" r="4" fill="#1e293b"/> <!-- hip joint -->
  <circle cx="258" cy="118" r="4" fill="#1e293b"/> <!-- shoulder joint -->

  <!-- Knee-against-tank marker, label offset to the left with a leader line to avoid the knee joint -->
  <circle cx="195" cy="212" r="9" fill="none" stroke="#0284c7" stroke-width="2" stroke-dasharray="3 3"/>
  <line x1="186" y1="212" x2="110" y2="200" stroke="#0284c7" stroke-width="1.5"/>
  <rect x="35" y="188" width="80" height="16" fill="#f8fafc" opacity="0.9"/>
  <text x="75" y="200" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#0284c7">Knees against tank</text>

  <!-- Eyes on the horizon: small eye dot on the helmet, arrow out to a horizon marker -->
  <circle cx="272" cy="92" r="2.5" fill="#0284c7"/>
  <line x1="275" y1="92" x2="345" y2="80" stroke="#0284c7" stroke-width="2.5" marker-end="url(#arrowh)"/>
  <defs>
    <marker id="arrowh" markerWidth="9" markerHeight="9" refX="4.5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#0284c7"/>
    </marker>
  </defs>
  <line x1="345" y1="80" x2="380" y2="80" stroke="#0284c7" stroke-width="2" stroke-dasharray="4 3"/>
  <rect x="300" y="60" width="90" height="16" fill="#f8fafc" opacity="0.9"/>
  <text x="345" y="72" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#0284c7">Eyes on the horizon</text>

  <!-- Brake force split, from the lesson text -->
  <text x="485" y="135" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="700" fill="#1e293b">Brake force split</text>
  <rect x="450" y="150" width="70" height="120" fill="#e2e8f0" stroke="#94a3b8"/>
  <rect x="450" y="150" width="70" height="88" fill="#0284c7"/>
  <text x="485" y="185" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="700" fill="#ffffff">Front</text>
  <text x="485" y="200" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="700" fill="#ffffff">~70-80%</text>
  <text x="485" y="255" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1e293b">Rear</text>
  <text x="485" y="270" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#1e293b">~20-30%</text>
</svg>
