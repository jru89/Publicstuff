<svg viewBox="0 0 420 280" xmlns="http://www.w3.org/2000/svg">
  <title>Cyclist crossing priority</title>
  <desc>Top-down diagram of a marked cyclist crossing on a right-hand-traffic road: an approaching car stays in its own right-hand lane, positioned bottom-right, approaching the crossing correctly. A cyclist must yield before entering the crossing, but has priority over vehicles once on it.</desc>
  <rect width="420" height="280" fill="#f8fafc"/>
  <text x="210" y="24" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="700" fill="#1e293b">Cyclist crossing</text>

  <!-- Road (vertical), traffic travels upward, right-hand lane is on the right (x > 210) -->
  <rect x="150" y="40" width="120" height="220" fill="#64748b"/>
  <line x1="210" y1="40" x2="210" y2="260" stroke="#f8fafc" stroke-width="2" stroke-dasharray="8 8"/>

  <!-- Cycle path (horizontal) -->
  <rect x="0" y="120" width="420" height="60" fill="#94a3b8"/>

  <!-- Crossing markings on the road, within the cycle path band -->
  <g fill="#f8fafc">
    <rect x="158" y="125" width="10" height="50"/>
    <rect x="178" y="125" width="10" height="50"/>
    <rect x="198" y="125" width="10" height="50"/>
    <rect x="218" y="125" width="10" height="50"/>
    <rect x="238" y="125" width="10" height="50"/>
    <rect x="258" y="125" width="10" height="50"/>
  </g>

  <!-- Cyclist on the crossing (has priority here) -->
  <g transform="translate(210,150)">
    <circle r="12" fill="#0284c7"/>
    <circle cx="-16" r="7" fill="none" stroke="#0f172a" stroke-width="3"/>
    <circle cx="16" r="7" fill="none" stroke="#0f172a" stroke-width="3"/>
  </g>
  <text x="210" y="200" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="700" fill="#0284c7">On crossing: cyclist has priority</text>

  <!-- Car approaching, correctly positioned in its own (right) lane, below the crossing -->
  <g transform="translate(240,230)" fill="#0f172a">
    <rect x="-16" y="-20" width="32" height="40" rx="6"/>
  </g>
  <text x="240" y="270" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="700" fill="#1e293b">Approaches in its own lane, must yield</text>

  <text x="55" y="110" font-family="sans-serif" font-size="11" fill="#1e293b">Cycle path</text>
</svg>
