<svg viewBox="0 0 300 220" xmlns="http://www.w3.org/2000/svg">
  <title>Residential street scene</title>
  <desc>A residential street with houses on either side and a child's ball resting on the roadway, no roadway markings.</desc>
  <rect width="300" height="220" fill="#f8fafc"/>

  <rect x="60" y="0" width="180" height="220" fill="#94a3b8"/>

  <!-- houses on either side -->
  <g fill="#1e293b">
    <rect x="8" y="70" width="44" height="50"/>
    <path d="M 4,70 L 30,44 L 56,70 Z"/>
    <rect x="248" y="60" width="44" height="60"/>
    <path d="M 244,60 L 270,34 L 296,60 Z"/>
  </g>

  <!-- motorcycle, ridden slowly and centrally, not hugging an edge -->
  <g transform="translate(150,150)">
    <circle cx="0" cy="-24" r="9" fill="#2563eb"/>
    <circle cx="0" cy="24" r="9" fill="#2563eb"/>
    <rect x="-6" y="-20" width="12" height="40" rx="5" fill="#2563eb"/>
  </g>

  <!-- child's ball on the roadway -->
  <circle cx="105" cy="60" r="9" fill="#f59e0b"/>
</svg>
