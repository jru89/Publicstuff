<svg viewBox="0 0 260 300" xmlns="http://www.w3.org/2000/svg">
  <title>Motorcycle on a motorway</title>
  <desc>Top-down view of a multi-lane motorway with a motorcycle riding in the right-hand lane and an on-ramp joining from the right.</desc>
  <rect width="260" height="300" fill="#f8fafc"/>

  <rect x="20" y="0" width="220" height="300" fill="#64748b"/>
  <line x1="130" y1="0" x2="130" y2="300" stroke="#f8fafc" stroke-width="3" stroke-dasharray="16 12"/>
  <path d="M 240,300 L 240,220 L 200,140" fill="none" stroke="#64748b" stroke-width="40"/>

  <g transform="translate(175,120)">
    <circle cx="0" cy="-24" r="9" fill="#2563eb"/>
    <circle cx="0" cy="24" r="9" fill="#2563eb"/>
    <rect x="-6" y="-20" width="12" height="40" rx="5" fill="#2563eb"/>
  </g>
</svg>
