<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <title>Officer directing traffic beside a traffic light</title>
  <desc>An authorized person standing at an intersection with one arm raised, next to a traffic light showing green.</desc>
  <rect width="240" height="240" fill="#f8fafc"/>

  <!-- traffic light, showing green -->
  <g transform="translate(150,20)">
    <line x1="20" y1="90" x2="20" y2="150" stroke="#64748b" stroke-width="7"/>
    <rect x="0" y="0" width="40" height="96" rx="10" fill="#1e293b"/>
    <circle cx="20" cy="22" r="11" fill="#3f231e"/>
    <circle cx="20" cy="48" r="11" fill="#3f3a1e"/>
    <circle cx="20" cy="74" r="11" fill="#22c55e"/>
  </g>

  <!-- officer, arm raised -->
  <g transform="translate(30,40)">
    <line x1="40" y1="68" x2="40" y2="20" stroke="#1e293b" stroke-width="9" stroke-linecap="round"/>
    <circle cx="30" cy="44" r="15" fill="#1e293b"/>
    <rect x="14" y="60" width="32" height="56" rx="9" fill="#1e293b"/>
    <line x1="18" y1="68" x2="8" y2="112" stroke="#1e293b" stroke-width="9" stroke-linecap="round"/>
    <line x1="22" y1="116" x2="16" y2="170" stroke="#1e293b" stroke-width="9" stroke-linecap="round"/>
    <line x1="36" y1="116" x2="42" y2="170" stroke="#1e293b" stroke-width="9" stroke-linecap="round"/>
  </g>

  <line x1="10" y1="172" x2="230" y2="172" stroke="#cbd5e1" stroke-width="3"/>
</svg>
