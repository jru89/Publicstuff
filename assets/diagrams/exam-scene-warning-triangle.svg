<svg viewBox="0 0 300 220" xmlns="http://www.w3.org/2000/svg">
  <title>Stopped vehicle with a warning triangle</title>
  <desc>Top-down view of a road with a stopped car and a warning triangle placed on the road some distance behind it.</desc>
  <rect width="300" height="220" fill="#f8fafc"/>

  <rect x="0" y="60" width="300" height="100" fill="#64748b"/>
  <line x1="0" y1="110" x2="300" y2="110" stroke="#f8fafc" stroke-width="3" stroke-dasharray="16 12"/>

  <!-- stopped car, right-hand lane -->
  <rect x="220" y="76" width="60" height="30" rx="7" fill="#f1f5f9" stroke="#334155" stroke-width="2"/>

  <!-- warning triangle, placed on the road well behind the car -->
  <g transform="translate(80,120)">
    <path d="M 0,-16 L 14,10 L -14,10 Z" fill="none" stroke="#ef4444" stroke-width="4" stroke-linejoin="round"/>
  </g>
</svg>
