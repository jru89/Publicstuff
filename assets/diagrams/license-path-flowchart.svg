<svg viewBox="0 0 620 340" xmlns="http://www.w3.org/2000/svg">
  <title>Paths to a motorcycle license</title>
  <desc>Flowchart of the ways to obtain a motorcycle license: direct access with either 9 hours of practice plus a provisional L-plate period, or 12 hours of practice going straight to the public road exam; or progressive training through A1, A2, and A, with earlier access to A possible if you already held an A2.</desc>
  <rect width="620" height="340" fill="#f8fafc"/>
  <text x="310" y="26" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="700" fill="#1e293b">Paths to a license</text>

  <text x="20" y="55" font-family="sans-serif" font-size="12" font-weight="700" fill="#1e293b">Direct access</text>

  <!-- Shared start: theory -->
  <rect x="20" y="65" width="100" height="40" rx="8" fill="#0284c7"/>
  <text x="70" y="89" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="700" fill="#fff">Theory exam</text>

  <!-- Branch point -->
  <line x1="120" y1="85" x2="150" y2="85" stroke="#1e293b" stroke-width="2"/>
  <line x1="150" y1="85" x2="150" y2="55" stroke="#1e293b" stroke-width="2"/>
  <line x1="150" y1="85" x2="150" y2="115" stroke="#1e293b" stroke-width="2"/>

  <!-- Branch A: 9h -> private terrain -> L -->
  <line x1="150" y1="55" x2="175" y2="55" stroke="#1e293b" stroke-width="2" marker-end="url(#lf)"/>
  <defs><marker id="lf" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#1e293b"/></marker></defs>
  <rect x="178" y="35" width="110" height="40" rx="8" fill="#334155"/>
  <text x="233" y="52" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="700" fill="#fff">9h practical</text>
  <text x="233" y="66" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="700" fill="#fff">lessons</text>

  <line x1="288" y1="55" x2="313" y2="55" stroke="#1e293b" stroke-width="2" marker-end="url(#lf)"/>
  <rect x="316" y="35" width="120" height="40" rx="8" fill="#334155"/>
  <text x="376" y="52" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="700" fill="#fff">Private terrain</text>
  <text x="376" y="66" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="700" fill="#fff">exam</text>

  <line x1="436" y1="55" x2="461" y2="55" stroke="#1e293b" stroke-width="2" marker-end="url(#lf)"/>
  <rect x="464" y="35" width="120" height="40" rx="8" fill="#16a34a"/>
  <text x="524" y="52" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="700" fill="#fff">Get "L" plate</text>
  <text x="524" y="66" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="700" fill="#fff">practice period</text>

  <!-- Branch B: 12h -> private terrain -> public road -->
  <line x1="150" y1="115" x2="175" y2="115" stroke="#1e293b" stroke-width="2" marker-end="url(#lf)"/>
  <rect x="178" y="95" width="110" height="40" rx="8" fill="#334155"/>
  <text x="233" y="112" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="700" fill="#fff">12h practical</text>
  <text x="233" y="126" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="700" fill="#fff">lessons</text>

  <line x1="288" y1="115" x2="313" y2="115" stroke="#1e293b" stroke-width="2" marker-end="url(#lf)"/>
  <rect x="316" y="95" width="120" height="40" rx="8" fill="#334155"/>
  <text x="376" y="112" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="700" fill="#fff">Private terrain</text>
  <text x="376" y="126" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="700" fill="#fff">exam</text>

  <line x1="436" y1="115" x2="461" y2="115" stroke="#1e293b" stroke-width="2" marker-end="url(#lf)"/>
  <rect x="464" y="95" width="120" height="40" rx="8" fill="#16a34a"/>
  <text x="524" y="112" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="700" fill="#fff">Public road exam</text>
  <text x="524" y="126" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#e2e8f0">(no L period)</text>

  <line x1="330" y1="155" x2="330" y2="170" stroke="#94a3b8" stroke-width="1"/>
  <text x="330" y="182" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#64748b">The "L" plate path leads to the public road exam later, after the practice period</text>

  <!-- Progressive path -->
  <text x="20" y="225" font-family="sans-serif" font-size="12" font-weight="700" fill="#1e293b">Progressive training</text>

  <g font-family="sans-serif" font-size="11" font-weight="700" fill="#fff">
    <rect x="20" y="235" width="90" height="40" rx="8" fill="#0f172a"/>
    <text x="65" y="259" text-anchor="middle">A1 (18+)</text>
    <line x1="110" y1="255" x2="150" y2="255" stroke="#1e293b" stroke-width="2" marker-end="url(#lf)"/>
    <text x="130" y="248" text-anchor="middle" font-size="9" font-weight="400" fill="#64748b">2 yrs</text>

    <rect x="150" y="235" width="90" height="40" rx="8" fill="#0f172a"/>
    <text x="195" y="259" text-anchor="middle">A2 (20+)</text>
    <line x1="240" y1="255" x2="280" y2="255" stroke="#1e293b" stroke-width="2" marker-end="url(#lf)"/>
    <text x="260" y="248" text-anchor="middle" font-size="9" font-weight="400" fill="#64748b">2 yrs</text>

    <rect x="280" y="235" width="90" height="40" rx="8" fill="#0f172a"/>
    <text x="325" y="259" text-anchor="middle">A (24+)</text>
  </g>

  <text x="65" y="292" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#64748b">Or skip A1</text>
  <text x="195" y="305" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="700" fill="#0284c7">Already held an A2? You can access A earlier</text>

  <text x="310" y="330" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#64748b">Fewer extra practice hours are needed at each progressive step</text>
</svg>
