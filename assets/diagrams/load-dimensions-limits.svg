<svg viewBox="0 0 420 300" xmlns="http://www.w3.org/2000/svg">
  <title>Maximum load dimensions</title>
  <desc>Side-view diagram of a loaded motorcycle showing the legal maximum dimensions: 4 meters total height, load must not protrude beyond the front bodywork, and maximum 50 cm rear overhang beyond the vehicle.</desc>
  <rect width="420" height="300" fill="#f8fafc"/>
  <text x="210" y="24" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="700" fill="#1e293b">Maximum load dimensions</text>

  <!-- Ground -->
  <line x1="40" y1="250" x2="380" y2="250" stroke="#1e293b" stroke-width="2"/>

  <!-- Motorcycle silhouette -->
  <circle cx="110" cy="230" r="26" fill="none" stroke="#1e293b" stroke-width="4"/>
  <circle cx="290" cy="230" r="26" fill="none" stroke="#1e293b" stroke-width="4"/>
  <path d="M 110,230 L 150,190 L 220,180 L 260,150 L 290,230" fill="none" stroke="#1e293b" stroke-width="4" stroke-linejoin="round"/>
  <rect x="150" y="160" width="35" height="22" rx="6" fill="#334155"/>

  <!-- Rear luggage / load -->
  <rect x="120" y="150" width="45" height="40" rx="6" fill="#0284c7" opacity="0.85"/>

  <!-- Height guide -->
  <line x1="60" y1="20" x2="60" y2="250" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4 4"/>
  <line x1="52" y1="20" x2="68" y2="20" stroke="#1e293b" stroke-width="2"/>
  <line x1="52" y1="250" x2="68" y2="250" stroke="#1e293b" stroke-width="2"/>
  <text x="45" y="140" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="700" fill="#1e293b" transform="rotate(-90 45 140)">Max. height: 4 m</text>

  <!-- Rear overhang guide -->
  <line x1="120" y1="270" x2="90" y2="270" stroke="#1e293b" stroke-width="2"/>
  <line x1="120" y1="264" x2="120" y2="276" stroke="#1e293b" stroke-width="2"/>
  <line x1="90" y1="264" x2="90" y2="276" stroke="#1e293b" stroke-width="2"/>
  <text x="105" y="288" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="700" fill="#1e293b">Max. 50 cm rear overhang</text>

  <!-- Front rule -->
  <line x1="260" y1="150" x2="260" y2="130" stroke="#0284c7" stroke-width="1.5"/>
  <text x="335" y="130" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="700" fill="#1e293b">Load must not extend</text>
  <text x="335" y="144" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="700" fill="#1e293b">beyond the front bodywork</text>

  <text x="210" y="280" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#64748b">Width: 1.25 m without sidecar</text>
</svg>
