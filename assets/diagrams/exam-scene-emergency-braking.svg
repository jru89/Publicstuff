<svg viewBox="0 0 280 220" xmlns="http://www.w3.org/2000/svg">
  <title>Motorcycle braking hard</title>
  <desc>Side view of a motorcycle and rider braking hard, with the front suspension compressed and short motion lines behind the rear wheel.</desc>
  <rect width="280" height="220" fill="#f8fafc"/>
  <line x1="10" y1="176" x2="270" y2="176" stroke="#cbd5e1" stroke-width="3"/>

  <circle cx="100" cy="160" r="20" fill="#1e293b"/>
  <circle cx="210" cy="160" r="20" fill="#1e293b"/>
  <path d="M 100,160 L 130,112 L 190,108 L 210,160" fill="none" stroke="#1e293b" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="150" y="96" width="34" height="14" rx="6" fill="#1e293b"/>

  <!-- rider, weight forward, looking ahead -->
  <circle cx="163" cy="66" r="13" fill="#2563eb"/>
  <path d="M 163,79 L 150,108" stroke="#2563eb" stroke-width="9" stroke-linecap="round"/>

  <!-- motion lines behind the rear wheel -->
  <g stroke="#94a3b8" stroke-width="3" stroke-linecap="round">
    <line x1="70" y1="176" x2="50" y2="176"/>
    <line x1="70" y1="184" x2="55" y2="184"/>
  </g>
</svg>
