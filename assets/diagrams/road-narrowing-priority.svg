<svg viewBox="0 0 420 220" xmlns="http://www.w3.org/2000/svg">
  <title>Road narrowing priority</title>
  <desc>Top-down diagram of a road narrowing to a single passable width: without signs, the driver on the side of the obstacle (approaching from the right, top lane) yields to the driver on the open side (bottom lane).</desc>
  <rect width="420" height="220" fill="#f8fafc"/>
  <text x="210" y="24" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="700" fill="#1e293b">Road narrowing</text>

  <!-- Road -->
  <rect x="20" y="80" width="380" height="70" fill="#64748b"/>
  <!-- Obstacle narrowing the road from the top -->
  <path d="M 150,80 L 270,80 L 240,115 L 180,115 Z" fill="#f97316" opacity="0.85"/>
  <text x="210" y="102" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="700" fill="#7c2d12">Obstacle</text>

  <!-- Vehicle on obstacle side (top lane), approaching from the right, before the obstacle, yielding -->
  <rect x="330" y="90" width="30" height="18" rx="4" fill="#ef4444"/>
  <!-- Vehicle on open side (bottom lane), has priority -->
  <rect x="185" y="128" width="30" height="18" rx="4" fill="#22c55e"/>

  <text x="345" y="185" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="700" fill="#991b1b">Obstacle side: yields</text>
  <text x="120" y="185" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="700" fill="#166534">Open side: priority</text>

  <text x="210" y="205" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#64748b">With signs: B19 (red) = yield, B21 (blue) = you have priority</text>
</svg>
