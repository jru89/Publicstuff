<svg viewBox="0 0 460 380" xmlns="http://www.w3.org/2000/svg">
  <title>Group riding: staggered (brick) formation</title>
  <desc>Top-down diagram of a group of motorcycles riding in a staggered two-column formation within a single lane: the lead rider two-thirds toward the right of the lane, the second rider one-third toward the right, and so on, each offset for sightlines and following distance.</desc>
  <rect width="460" height="380" fill="#f8fafc"/>
  <text x="230" y="24" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="700" fill="#1e293b">Staggered group formation</text>

  <!-- Road -->
  <rect x="90" y="40" width="280" height="300" fill="#64748b"/>
  <rect x="90" y="40" width="6" height="300" fill="#f8fafc"/>
  <rect x="364" y="40" width="6" height="300" fill="#f8fafc"/>
  <line x1="230" y1="40" x2="230" y2="340" stroke="#94a3b8" stroke-width="2" stroke-dasharray="10 10"/>

  <!-- Two position reference lines, both within this lane (230 to 370) -->
  <line x1="323" y1="40" x2="323" y2="340" stroke="#0284c7" stroke-width="1.5" stroke-dasharray="4 6" opacity="0.6"/>
  <line x1="277" y1="40" x2="277" y2="340" stroke="#0284c7" stroke-width="1.5" stroke-dasharray="4 6" opacity="0.6"/>

  <!-- Riders, staggered: odd riders 2/3 right (323), even riders 1/3 right (277), each further back, spaced for label room -->
  <g fill="#0f172a">
    <g transform="translate(323,80)"><ellipse rx="12" ry="26"/></g>
    <g transform="translate(277,155)"><ellipse rx="12" ry="26"/></g>
    <g transform="translate(323,230)"><ellipse rx="12" ry="26"/></g>
    <g transform="translate(277,305)"><ellipse rx="12" ry="26"/></g>
  </g>

  <!-- Labels beside each rider, with backing chips for contrast against the road -->
  <g font-family="sans-serif" font-size="11" font-weight="700" fill="#1e293b">
    <rect x="20" y="70" width="60" height="20" fill="#f8fafc" opacity="0.9"/>
    <text x="50" y="84" text-anchor="middle">Lead: 2/3</text>

    <rect x="380" y="145" width="60" height="20" fill="#f8fafc" opacity="0.9"/>
    <text x="410" y="159" text-anchor="middle">2nd: 1/3</text>

    <rect x="20" y="220" width="60" height="20" fill="#f8fafc" opacity="0.9"/>
    <text x="50" y="234" text-anchor="middle">3rd: 2/3</text>

    <rect x="380" y="295" width="60" height="20" fill="#f8fafc" opacity="0.9"/>
    <text x="410" y="309" text-anchor="middle">4th: 1/3</text>
  </g>

  <text x="230" y="365" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#64748b">Fractions are measured within your own lane, not the full road</text>
</svg>
