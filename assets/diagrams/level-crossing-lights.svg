<svg viewBox="0 0 400 260" xmlns="http://www.w3.org/2000/svg">
  <title>Level crossing lights</title>
  <desc>Comparison of level crossing (railway) signals: a flashing moon-white light means it is safe to cross, alternating flashing red lights mean do not cross. Includes the official level crossing warning sign for context.</desc>
  <rect width="400" height="260" fill="#f8fafc"/>
  <text x="200" y="24" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="700" fill="#1e293b">Level crossing lights</text>

  <!-- Official level crossing warning sign, from assets/signs -->
  <image href="../signs/danger/A45.png" x="170" y="34" width="60" height="60" />
  <text x="200" y="103" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#64748b">Sign A45 — level crossing</text>

  <!-- Safe -->
  <g transform="translate(40,115)">
    <rect x="0" y="0" width="150" height="120" rx="10" fill="#e2e8f0"/>
    <circle cx="75" cy="45" r="24" fill="#f8fafc" stroke="#94a3b8" stroke-width="3"/>
    <path d="M 75,25 A 20,20 0 1 0 75,65 A 16,16 0 1 1 75,25" fill="#cbd5e1"/>
    <text x="75" y="88" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="700" fill="#1e293b">Moon-white</text>
    <text x="75" y="103" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#16a34a">Safe to cross</text>
  </g>

  <!-- Danger -->
  <g transform="translate(210,115)">
    <rect x="0" y="0" width="150" height="120" rx="10" fill="#e2e8f0"/>
    <circle cx="50" cy="45" r="18" fill="#ef4444"/>
    <circle cx="100" cy="45" r="18" fill="#fecaca"/>
    <text x="75" y="88" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="700" fill="#1e293b">Alternating red</text>
    <text x="75" y="103" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#dc2626">Do not cross</text>
  </g>

  <text x="200" y="255" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#64748b">Crossing on alternating red is a serious violation</text>
</svg>
