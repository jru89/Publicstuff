<svg viewBox="0 0 260 220" xmlns="http://www.w3.org/2000/svg">
  <title>Cyclist on a marked crossing</title>
  <desc>Top-down view of a road with a dashed cyclist crossing, a cyclist already riding across it, and a car approaching.</desc>
  <rect width="260" height="220" fill="#f8fafc"/>

  <rect x="0" y="60" width="260" height="100" fill="#64748b"/>
  <g fill="#f8fafc">
    <rect x="110" y="60" width="10" height="18"/>
    <rect x="110" y="88" width="10" height="18"/>
    <rect x="110" y="116" width="10" height="18"/>
    <rect x="110" y="144" width="10" height="16"/>
    <rect x="140" y="60" width="10" height="18"/>
    <rect x="140" y="88" width="10" height="18"/>
    <rect x="140" y="116" width="10" height="18"/>
    <rect x="140" y="144" width="10" height="16"/>
  </g>

  <!-- cyclist, already on the crossing -->
  <g transform="translate(125,110)">
    <circle cx="0" cy="-16" r="7" fill="#334155"/>
    <circle cx="-9" cy="16" r="9" fill="#0f172a"/>
    <circle cx="9" cy="16" r="9" fill="#0f172a"/>
    <line x1="0" y1="-10" x2="0" y2="16" stroke="#0f172a" stroke-width="4"/>
  </g>

  <!-- approaching car -->
  <rect x="205" y="94" width="34" height="30" rx="6" fill="#f1f5f9" stroke="#334155" stroke-width="2"/>
</svg>
