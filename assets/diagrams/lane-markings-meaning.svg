<svg viewBox="0 0 620 300" xmlns="http://www.w3.org/2000/svg">
  <title>Lane marking meanings</title>
  <desc>Right-hand traffic: overtaking means leaving your right-hand lane and crossing into the left-hand (oncoming) lane. A broken line on your side allows this. A solid line does not. A mixed marking that goes from broken to solid partway through means you can start overtaking but must complete it and return before the line turns solid on your return side, or wait until it is broken again.</desc>
  <rect width="620" height="300" fill="#f8fafc"/>
  <text x="310" y="24" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="700" fill="#1e293b">Lane marking meanings (right-hand traffic)</text>

  <!-- Panel 1: broken line -->
  <g transform="translate(20,45)">
    <rect x="0" y="0" width="170" height="130" fill="#64748b"/>
    <line x1="85" y1="0" x2="85" y2="130" stroke="#f8fafc" stroke-width="4" stroke-dasharray="14 10"/>
    <!-- car in right lane, arrow crossing left into oncoming lane -->
    <rect x="112" y="95" width="18" height="26" rx="4" fill="#0f172a"/>
    <path d="M 121,95 C 105,65 75,50 55,40" stroke="#0284c7" stroke-width="3" fill="none" marker-end="url(#lm1)"/>
    <defs><marker id="lm1" markerWidth="9" markerHeight="9" refX="4.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#0284c7"/></marker></defs>
    <text x="85" y="150" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="700" fill="#1e293b">Broken line</text>
    <text x="85" y="165" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#16a34a">May cross to overtake</text>
  </g>

  <!-- Panel 2: solid line -->
  <g transform="translate(220,45)">
    <rect x="0" y="0" width="170" height="130" fill="#64748b"/>
    <line x1="85" y1="0" x2="85" y2="130" stroke="#f8fafc" stroke-width="4"/>
    <rect x="112" y="95" width="18" height="26" rx="4" fill="#0f172a"/>
    <line x1="121" y1="95" x2="85" y2="55" stroke="#ef4444" stroke-width="3"/>
    <line x1="75" y1="45" x2="95" y2="65" stroke="#ef4444" stroke-width="3"/>
    <line x1="95" y1="45" x2="75" y2="65" stroke="#ef4444" stroke-width="3"/>
    <text x="85" y="150" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="700" fill="#1e293b">Solid line</text>
    <text x="85" y="165" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#dc2626">May not cross</text>
  </g>

  <!-- Panel 3: mixed sequential marking -->
  <g transform="translate(420,45)">
    <rect x="0" y="0" width="180" height="130" fill="#64748b"/>
    <!-- three sections: broken (bottom), solid (middle), broken (top) -->
    <line x1="90" y1="95" x2="90" y2="130" stroke="#f8fafc" stroke-width="4" stroke-dasharray="10 8"/>
    <line x1="90" y1="35" x2="90" y2="95" stroke="#f8fafc" stroke-width="4"/>
    <line x1="90" y1="0" x2="90" y2="35" stroke="#f8fafc" stroke-width="4" stroke-dasharray="10 8"/>
    <!-- overtaking path: cross while broken, travel in oncoming lane during solid, return once broken again -->
    <path d="M 115,120 C 100,105 60,90 55,60 C 52,45 60,25 80,10" stroke="#0284c7" stroke-width="3" fill="none" stroke-dasharray="3 5" marker-end="url(#lm1)"/>
    <text x="90" y="150" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="700" fill="#1e293b">Mixed (dual lane)</text>
    <text x="90" y="165" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#1e293b">Cross when broken, must</text>
    <text x="90" y="178" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#1e293b">return before it's solid</text>
  </g>

  <text x="310" y="225" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#64748b">Right-hand traffic: your lane is on the right, overtake by crossing left</text>
  <text x="310" y="242" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#64748b">Orange roadwork markings override white ones when both are present</text>
</svg>
